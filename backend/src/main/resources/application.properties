spring.application.name=openshelf-library
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/openshelf_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:4962}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:replace-this-development-secret-with-a-long-random-value-32bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:admin@openshelf.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
